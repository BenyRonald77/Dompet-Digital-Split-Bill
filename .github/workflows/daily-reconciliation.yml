name: Daily Ledger Reconciliation

# Memicu job rekonsiliasi harian tanpa perlu proses server yang selalu
# menyala. Sesuaikan APP_URL & CRON_SECRET di repo Settings > Secrets and
# variables > Actions, lalu aktifkan lagi jadwalnya (uncomment blok
# `schedule:` di bawah, cron "0 18 * * *" = jam 01:00 WIB) sebelum
# mengandalkan workflow ini berjalan otomatis.
on:
  # schedule:
  #   - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint reconcile
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/reconcile" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
